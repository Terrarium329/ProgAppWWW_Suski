<!DOCTYPE HTML>
<html lang="pl">
	<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="./css/style.css" rel="stylesheet">
	<script src="./js/main.js" defer></script>
	<title>Strona sklepu</title>
	</head>

	<body>

	<header>

	<h1>Strona kontaktu z klientem!</h1>
	
	<nav class="menu">
	
	<a href="./index.html">Index</a>
	<a href="./produkt.html">Produkt</a>
	<a href="./kontakt.html" aria-current="page">Kontakt</a>
	</nav>

	</header>	
	
	<main>


	<h2>Formularz</h2>
	<p>Formularz demonstracyjny. Dane pojawią się w adresie strony; zapytanie nie 
zostanie zapisane ani wysłane e-mailem</p>

	<form>
	<label for="email">e-mail: <input type="email" name="email" required id="email"></label>
	<label for="produkt">produkt: <select name="produkt" required id="produkt">
		<option value="">Wybierz produkt</option>
		<option value="1">Mercedes</option>
		<option value="2">Chrysler</option>
		<option value="3">Ford</option>
		</select>
	</label>
	<label for="ilosc">liczba sztuk: <input type="number" name="ilosc" min="1" max="5" step="1" required id="ilosc"></label>
	<label for="wiadomosc">wiadomość: <textarea name="wiadomosc" required minlength="10" maxlength="500" id="wiadomosc"></textarea></label>
	<button type="submit">Sprawdź zapytanie</button>
	</form>

	<section id="wynik" aria-live="polite"></section>
	</main>	

	<footer>Testowy footer</footer>

	</body>
</html>
